name: Atualizar dados

on:
  schedule:
    - cron: '0 9 * * *'      # 9h UTC = 6h em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na mão

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar dados do Power BI
        run: python scripts/extrair.py

      - name: Gerar JSONs
        run: python scripts/gerar_json.py

      - name: Salvar no repositório
        run: |
          git config user.name "bot-dados"
          git config user.email "bot@users.noreply.github.com"
          date -u +%F > data/ultima_execucao.txt
          git add data
          git diff --staged --quiet || git commit -m "Atualização $(date -u +%F)"
          git push
